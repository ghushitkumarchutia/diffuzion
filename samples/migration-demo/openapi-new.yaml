openapi: 3.0.3
info:
  title: Diffuzion account demo
  version: 2.0.0
servers:
  - url: https://api.diffuzion.example/v1
paths:
  /users:
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                  enum:
                    - active
                region:
                  type: string
                  enum:
                    - IN
                    - US
              required:
                - name
                - region
      responses:
        "201":
          description: Created
  /users/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
